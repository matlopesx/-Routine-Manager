name: CI

on:
  pull_request:
    branches: [dev, main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  branch-name:
    name: branch-name
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR branch name
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Não é PR (push / dispatch) — skip da validação de nome"
            exit 0
          fi

          name=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]')
          echo "branch=$name"

          if echo "$name" | grep -Eq '^(feat|feature|hotfix|fix|bugfix|bug|ref|refactor|ci|docs|chore|dev)[a-z0-9._-]+$'; then
            echo "nome de branch válido"
            exit 0
          fi

          echo "::error::Branch inválida: '$BRANCH'"
          echo "Use: type/descricao-em-kebab-case"
          echo "Tipos: feat/  feature/  hotfix/  fix/  bugfix/  bug/  ref/  refactor/  ci/  docs/  chore/ dev/"
          echo "Exemplo: feat/add-habit-reminder"
          exit 1

      - name: Validate PR title
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Não é PR — skip da validação de título"
            exit 0
          fi

          echo "title=$TITLE"
          if echo "$TITLE" | grep -Eq '^(feat|feature|hotfix|fix|bugfix|bug|ref|refactor|ci|docs|chore)(\([a-z0-9_-]+\))?: .+'; then
            echo "título de PR válido"
            exit 0
          fi

          echo "::error::Título de PR inválido: '$TITLE'"
          echo "Use conventional commits: tipo: descrição"
          echo "Tipos: feat:  fix:  bug:  ref:  ci:  docs:  chore:"
          echo "Exemplo: feat: adiciona lembrete de hábito"
          echo "Com escopo: feat(auth): persiste refresh no registro"
          exit 1

  review-context:
    name: review-context
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR size + files for review
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "## Code review context" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**PR:** #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ github.head_ref }}\` → \`${{ github.base_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          stats=$(git diff --shortstat "$BASE...$HEAD" || true)
          files=$(git diff --name-only "$BASE...$HEAD" || true)
          file_count=$(printf '%s\n' "$files" | sed '/^$/d' | wc -l | tr -d ' ')
          additions=$(git diff --numstat "$BASE...$HEAD" | awk '{ a+=$1 } END { print a+0 }')
          deletions=$(git diff --numstat "$BASE...$HEAD" | awk '{ d+=$2 } END { print d+0 }')

          echo "**Diff:** +${additions} / −${deletions} em ${file_count} arquivo(s)" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$stats" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$stats\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Arquivos alterados" >> "$GITHUB_STEP_SUMMARY"
          if [ "$file_count" = "0" ]; then
            echo "_Nenhum arquivo alterado_" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' "$files" | sed '/^$/d' | sed 's/^/- `/;s/$/`/' >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Checklist do review" >> "$GITHUB_STEP_SUMMARY"
          echo "- [ ] Escopo do PR bate com o título/branch" >> "$GITHUB_STEP_SUMMARY"
          echo "- [ ] Sem secrets, tokens ou .env no diff" >> "$GITHUB_STEP_SUMMARY"
          echo "- [ ] Erros/edge cases tratados; logs sem PII" >> "$GITHUB_STEP_SUMMARY"
          echo "- [ ] Testes cobrem o caminho feliz e falha relevante" >> "$GITHUB_STEP_SUMMARY"
          echo "- [ ] Clean Arch: domain sem dependência de HTTP/DB" >> "$GITHUB_STEP_SUMMARY"
          echo "- [ ] API/contratos: breaking change documentada?" >> "$GITHUB_STEP_SUMMARY"

          total=$((additions + deletions))
          if [ "$total" -gt 800 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ⚠️ Diff grande (${total} linhas). Prefira PRs menores para review com qualidade." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::PR grande: ${total} linhas alteradas. Considere dividir."
          fi

  # Resolve package.json na raiz ou em backend/
  node-setup:
    name: node-setup
    needs: branch-name
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.pkg.outputs.present }}
      workdir: ${{ steps.pkg.outputs.workdir }}
      has_lint: ${{ steps.pkg.outputs.has_lint }}
      has_test: ${{ steps.pkg.outputs.has_test }}
      has_build: ${{ steps.pkg.outputs.has_build }}
      lockfile: ${{ steps.pkg.outputs.lockfile }}
    steps:
      - uses: actions/checkout@v4

      - name: Locate Node project
        id: pkg
        run: |
          workdir=""
          if [ -f package.json ]; then
            workdir="."
          elif [ -f backend/package.json ]; then
            workdir="backend"
          fi

          if [ -z "$workdir" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "workdir=" >> "$GITHUB_OUTPUT"
            echo "has_lint=false" >> "$GITHUB_OUTPUT"
            echo "has_test=false" >> "$GITHUB_OUTPUT"
            echo "has_build=false" >> "$GITHUB_OUTPUT"
            echo "lockfile=none" >> "$GITHUB_OUTPUT"
            echo "::warning::package.json ausente (raiz ou backend/) — skip lint/test/security Node"
            exit 0
          fi

          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "workdir=$workdir" >> "$GITHUB_OUTPUT"

          if [ -f "$workdir/package-lock.json" ]; then
            echo "lockfile=npm" >> "$GITHUB_OUTPUT"
          elif [ -f "$workdir/pnpm-lock.yaml" ]; then
            echo "lockfile=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f "$workdir/yarn.lock" ]; then
            echo "lockfile=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "lockfile=none" >> "$GITHUB_OUTPUT"
          fi

          node -e "
            const p = require('./${workdir}/package.json');
            const s = p.scripts || {};
            const out = (k, v) => console.log(k + '=' + v);
            out('has_lint', Boolean(s.lint));
            out('has_test', Boolean(s.test));
            out('has_build', Boolean(s.build));
          " >> "$GITHUB_OUTPUT"

          echo "Node project em: $workdir"

  lint:
    name: lint
    needs: [branch-name, node-setup]
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ needs.node-setup.outputs.workdir || '.' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if no package
        if: needs.node-setup.outputs.present != 'true'
        run: echo "Sem package.json — skip lint"

      - uses: actions/setup-node@v4
        if: needs.node-setup.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        if: needs.node-setup.outputs.present == 'true'
        run: |
          case "${{ needs.node-setup.outputs.lockfile }}" in
            npm)  npm ci ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            yarn) corepack enable && yarn install --frozen-lockfile ;;
            *)    npm install ;;
          esac

      - name: Lint
        if: needs.node-setup.outputs.present == 'true' && needs.node-setup.outputs.has_lint == 'true'
        run: npm run lint

      - name: Lint script missing
        if: needs.node-setup.outputs.present == 'true' && needs.node-setup.outputs.has_lint != 'true'
        run: |
          echo "::warning::script \"lint\" não definido no package.json — adicione (ex: eslint .)"
          exit 0

  test:
    name: test-coverage-build
    needs: [branch-name, node-setup]
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ needs.node-setup.outputs.workdir || '.' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if no package
        if: needs.node-setup.outputs.present != 'true'
        run: echo "Sem package.json — skip test/build"

      - uses: actions/setup-node@v4
        if: needs.node-setup.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        if: needs.node-setup.outputs.present == 'true'
        run: |
          case "${{ needs.node-setup.outputs.lockfile }}" in
            npm)  npm ci ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            yarn) corepack enable && yarn install --frozen-lockfile ;;
            *)    npm install ;;
          esac

      - name: Test + coverage
        if: needs.node-setup.outputs.present == 'true' && needs.node-setup.outputs.has_test == 'true'
        run: |
          # Prefer scripts with coverage when available
          if node -e "process.exit(require('./package.json').scripts?.['test:coverage'] ? 0 : 1)"; then
            npm run test:coverage
          elif node -e "process.exit(require('./package.json').scripts?.['test:cov'] ? 0 : 1)"; then
            npm run test:cov
          else
            # Vitest/Jest often accept --coverage via npm test --
            npm test -- --coverage --coverage.thresholds.lines=35 2>/dev/null \
              || npm test -- --coverage 2>/dev/null \
              || npm test
          fi

      - name: Coverage summary
        if: needs.node-setup.outputs.present == 'true' && needs.node-setup.outputs.has_test == 'true'
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage/coverage-summary.json ]; then
            pct=$(node -e "const s=require('./coverage/coverage-summary.json').total.lines.pct; console.log(s)")
            echo "**${pct}%** lines (meta: ≥35% quando o projeto amadurecer)" >> "$GITHUB_STEP_SUMMARY"
            node -e "const p=require('./coverage/coverage-summary.json').total.lines.pct; if (p < 35) { console.error('Coverage abaixo de 35%:', p); process.exit(1) }"
          elif [ -f coverage/lcov.info ]; then
            echo "Relatório lcov gerado (gate numérico quando houver coverage-summary.json)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Testes ok — configure coverage (vitest/jest) para habilitar o gate de 35%" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Test script missing
        if: needs.node-setup.outputs.present == 'true' && needs.node-setup.outputs.has_test != 'true'
        run: |
          echo "::warning::script \"test\" não definido no package.json"
          exit 0

      - name: Build
        if: needs.node-setup.outputs.present == 'true' && needs.node-setup.outputs.has_build == 'true'
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: always() && needs.node-setup.outputs.present == 'true'
        with:
          name: coverage
          path: |
            ${{ needs.node-setup.outputs.workdir }}/coverage/
          if-no-files-found: ignore

  security:
    name: security
    needs: [branch-name, node-setup]
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ needs.node-setup.outputs.workdir || '.' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if no package
        if: needs.node-setup.outputs.present != 'true'
        run: echo "Sem package.json — skip npm audit"

      - uses: actions/setup-node@v4
        if: needs.node-setup.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        if: needs.node-setup.outputs.present == 'true'
        run: |
          case "${{ needs.node-setup.outputs.lockfile }}" in
            npm)  npm ci ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            yarn) corepack enable && yarn install --frozen-lockfile ;;
            *)    npm install ;;
          esac

      - name: npm audit (high+)
        if: needs.node-setup.outputs.present == 'true'
        run: |
          # Falha só em high/critical; moderate não bloqueia no começo do projeto
          npm audit --audit-level=high

  ci:
    name: ci
    if: always() && github.event.pull_request.draft != true
    needs: [branch-name, review-context, node-setup, lint, test, security]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate
        env:
          EVENT: ${{ github.event_name }}
          R_BRANCH: ${{ needs.branch-name.result }}
          R_REVIEW: ${{ needs.review-context.result }}
          R_SETUP: ${{ needs.node-setup.result }}
          R_LINT: ${{ needs.lint.result }}
          R_TEST: ${{ needs.test.result }}
          R_SEC: ${{ needs.security.result }}
        run: |
          echo "branch-name=$R_BRANCH"
          echo "review-context=$R_REVIEW"
          echo "node-setup=$R_SETUP"
          echo "lint=$R_LINT"
          echo "test=$R_TEST"
          echo "security=$R_SEC"

          fail=0
          [ "$R_BRANCH" = "failure" ] || [ "$R_BRANCH" = "cancelled" ] && fail=1
          [ "$R_SETUP" = "failure" ] || [ "$R_SETUP" = "cancelled" ] && fail=1
          [ "$R_LINT" = "failure" ] || [ "$R_LINT" = "cancelled" ] && fail=1
          [ "$R_TEST" = "failure" ] || [ "$R_TEST" = "cancelled" ] && fail=1
          [ "$R_SEC" = "failure" ] || [ "$R_SEC" = "cancelled" ] && fail=1

          if [ "$EVENT" = "pull_request" ]; then
            [ "$R_REVIEW" = "failure" ] || [ "$R_REVIEW" = "cancelled" ] && fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::CI falhou — não aprovar o PR até corrigir"
            exit 1
          fi

          echo "CI OK — pronto para review/aprovação"
